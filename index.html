<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#b7c1f8; overflow:hidden; }
  #pb-frame { display:block; border:0; width:100vw; height:100vh; }
</style>
</head>
<body>
<iframe id="pb-frame" title="Photobooth" allow="camera;microphone;fullscreen" allowfullscreen></iframe>

<div id="pb-intro" style="position:fixed;inset:0;z-index:120;background:rgba(13,16,48,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;backdrop-filter:blur(3px);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="color:#fff;font-size:22px;font-weight:600;text-align:center;line-height:1.4;max-width:22ch;">Enter full screen for better experience</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <button id="pb-intro-fs" style="display:flex;align-items:center;gap:8px;padding:12px 22px;border:0;border-radius:999px;background:#fff;color:#1a1550;font:700 14px inherit;cursor:pointer;box-shadow:0 6px 18px rgba(13,16,48,0.28);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1550" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 9 4 4 9 4"></polyline>
        <polyline points="15 4 20 4 20 9"></polyline>
        <polyline points="20 15 20 20 15 20"></polyline>
        <polyline points="9 20 4 20 4 15"></polyline>
      </svg>
      <span>Full screen</span>
    </button>
    <button id="pb-intro-skip" style="padding:12px 22px;border-radius:999px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.45);color:#fff;font:600 14px inherit;cursor:pointer;">Skip</button>
  </div>
</div>

<script>
(function () {
  var frame = document.getElementById('pb-frame');
  var intro = document.getElementById('pb-intro');

  // A reload of the app always lands on the landing page.
  frame.src = 'Landing.dc.html';

  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  function enter() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try { Promise.resolve(req.call(el)).catch(function () {}); } catch (e) {}
  }
  function leave() {
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (!ex) return;
    try { Promise.resolve(ex.call(document)).catch(function () {}); } catch (e) {}
  }

  function sendState() {
    try { frame.contentWindow.postMessage({ pb: 'fs-state', value: isFs() }, '*'); } catch (e) {}
  }

  document.addEventListener('fullscreenchange', sendState);
  document.addEventListener('webkitfullscreenchange', sendState);
  frame.addEventListener('load', sendState);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.pb) return;
    if (d.pb === 'nav' && typeof d.url === 'string') {
      // Fullscreen lives on this shell document, so swapping the page keeps it.
      frame.src = d.url;
    } else if (d.pb === 'fs-enter') enter();
    else if (d.pb === 'fs-exit') leave();
    else if (d.pb === 'fs-toggle') { isFs() ? leave() : enter(); }
    else if (d.pb === 'fs-query') sendState();
  });

  document.getElementById('pb-intro-fs').addEventListener('click', function () {
    enter();
    intro.style.display = 'none';
  });
  document.getElementById('pb-intro-skip').addEventListener('click', function () {
    intro.style.display = 'none';
  });
})();
</script>
</body>
</html>
