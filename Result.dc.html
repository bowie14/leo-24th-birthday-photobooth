<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="fullscreen.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  @keyframes spin-hint { 0%,100%{ transform: rotate(0deg); } 50%{ transform: rotate(90deg); } }
</style>
</helmet>
<div style="position:relative;width:100vw;height:100vh;overflow:hidden;background:#b7c1f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="{{ stageStyle }}">
    <img ref="{{ setBgRef }}" src="uploads/result-screen-desktop.png" alt="result background" style="position:absolute;inset:0;width:100%;height:100%;" />
    <img ref="{{ setStripRef }}" alt="Your photo strip" style="{{ stripStyle }}" />
    <sc-if value="{{ noStrip }}" hint-placeholder-val="{{ false }}">
      <div style="{{ noStripStyle }}">
        <div style="color:#1a1550;font-size:15px;font-weight:600;line-height:1.5;text-align:center;padding:16px;">No photo strip yet — take your photos first.</div>
      </div>
    </sc-if>
    <img src="uploads/btn-download.png" alt="Download" onClick="{{ onDownload }}" style="{{ downloadStyle }}" />
    <img src="uploads/btn-restart.png" alt="Restart" onClick="{{ onRestart }}" style="{{ restartStyle }}" />
  </div>
  <div onClick="{{ onToggleFullscreen }}" style="position:fixed;right:40px;bottom:40px;z-index:50;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,0.82);border:1px solid rgba(26,21,80,0.14);color:#1a1550;font-size:13px;font-weight:600;letter-spacing:0.01em;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(26,21,80,0.12);" style-hover="background:rgba(255,255,255,0.96);">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1550" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 9 4 4 9 4"></polyline>
      <polyline points="15 4 20 4 20 9"></polyline>
      <polyline points="20 15 20 20 15 20"></polyline>
      <polyline points="9 20 4 20 4 15"></polyline>
    </svg>
    <span>{{ fullscreenLabel }}</span>
  </div>
  <sc-if value="{{ showRotateOverlay }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(255,255,255,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:100;">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" style="animation:spin-hint 1.4s ease-in-out infinite;">
        <rect x="6" y="2" width="12" height="20" rx="2" stroke="#1a1550" stroke-width="1.8"></rect>
        <line x1="10" y1="19" x2="14" y2="19" stroke="#1a1550" stroke-width="1.8" stroke-linecap="round"></line>
      </svg>
      <div style="font-size:22px;font-weight:600;color:#1a1550;text-align:center;padding:0 32px;">Turn your phone sideways to keep going!</div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isTouch: false, vw: 1440, vh: 900, savedStrip: null, isFullscreen: false, isPortrait: false };

  componentDidMount() {
    const touchQuery = window.matchMedia('(pointer: coarse) and (hover: none)');
    this.setState({ isTouch: touchQuery.matches, vw: window.innerWidth, vh: window.innerHeight });
    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    window.addEventListener('resize', this.onResize);
    document.addEventListener('fullscreenchange', this.onFullscreenChange);
    document.addEventListener('pbfullscreenchange', this.onFullscreenChange);

    const portraitQuery = window.matchMedia('(orientation: portrait)');
    this.setState({ isPortrait: portraitQuery.matches });
    this.onOrientationChange = (e) => this.setState({ isPortrait: e.matches });
    portraitQuery.addEventListener('change', this.onOrientationChange);
    this._portraitQuery = portraitQuery;

    // only accept a stored strip that matches the final 1200x1800 format (rejects stale data from older builds)
    let saved = null;
    try { saved = localStorage.getItem('photobooth-strip'); } catch (e) {}
    if (saved) {
      const probe = new Image();
      probe.onload = () => {
        const ratio = probe.width / probe.height;
        if (Math.abs(ratio - 2 / 3) < 0.02) {
          this.setState({ savedStrip: saved });
        } else {
          try { localStorage.removeItem('photobooth-strip'); } catch (e) {}
        }
      };
      probe.src = saved;
    }
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('fullscreenchange', this.onFullscreenChange);
    document.removeEventListener('pbfullscreenchange', this.onFullscreenChange);
    if (this._portraitQuery) this._portraitQuery.removeEventListener('change', this.onOrientationChange);
  }

  onFullscreenChange = () => this.setState({ isFullscreen: !!(window.PBFullscreen && window.PBFullscreen.isFs()) });

  toggleFullscreen = () => {
    if (window.PBFullscreen) window.PBFullscreen.toggle();
  };

  componentDidUpdate() {
    this.syncImageRefs();
  }

  setBgRef = (el) => { this.bgRef = el; this.syncImageRefs(); };
  setStripRef = (el) => { this.stripRef = el; this.syncImageRefs(); };

  syncImageRefs = () => {
    const bgSrc = this.state.isTouch ? 'uploads/result-screen-mobile.png' : 'uploads/result-screen-desktop.png';
    const stripSrc = this.state.savedStrip;
    if (this.bgRef && this.bgRef.getAttribute('src') !== bgSrc) this.bgRef.src = bgSrc;
    if (this.stripRef) {
      if (stripSrc) {
        if (this.stripRef.getAttribute('src') !== stripSrc) this.stripRef.src = stripSrc;
        this.stripRef.style.visibility = 'visible';
      } else {
        if (this.stripRef.hasAttribute('src')) this.stripRef.removeAttribute('src');
        this.stripRef.style.visibility = 'hidden';
      }
    }
  };

  handleDownload = () => {
    if (!this.state.savedStrip) return;
    const a = document.createElement('a');
    a.href = this.state.savedStrip;
    a.download = 'photobooth-strip.jpg';
    a.click();
  };

  handleRestart = () => {
    try { localStorage.removeItem('photobooth-strip'); } catch (e) {}
    if (window.PBFullscreen) window.PBFullscreen.navigate('Landing.dc.html');
    else window.location.href = 'Landing.dc.html';
  };

  renderVals() {
    const isTouch = this.state.isTouch;
    const designW = isTouch ? 844 : 1440;
    const designH = isTouch ? 390 : 900;

    const rects = isTouch
      ? {
          strip: { left: 41.968, top: 16.887, width: 18.31, height: 59.423 },
          download: { left: 36.610, top: 82.879, width: 10.723, height: 6.967 },
          restart: { left: 51.930, top: 82.879, width: 15.258, height: 6.967 },
        }
      : {
          strip: { left: 37.23, top: 15.924, width: 25.538, height: 61.291 },
          download: { left: 29.75, top: 83.991, width: 14.958, height: 7.184 },
          restart: { left: 51.132, top: 83.991, width: 21.286, height: 7.184 },
        };

    const vw = this.state.vw || designW;
    const vh = this.state.vh || designH;
    const scale = Math.max(vw / designW, vh / designH) * 0.95;
    const stageW = designW * scale;
    const stageH = designH * scale;
    const stageStyle = {
      position: 'absolute',
      left: (vw - stageW) / 2 + 'px',
      top: (vh - stageH) / 2 + 'px',
      width: stageW + 'px',
      height: stageH + 'px',
    };

    const toStyle = (r, extra) => Object.assign({
      position: 'absolute',
      left: r.left + '%',
      top: r.top + '%',
      width: r.width + '%',
      height: r.height + '%',
      objectFit: 'contain',
    }, extra || {});

    return {
      setBgRef: this.setBgRef,
      setStripRef: this.setStripRef,
      onToggleFullscreen: this.toggleFullscreen,
      showRotateOverlay: this.state.isTouch && this.state.isPortrait,
      fullscreenLabel: this.state.isFullscreen ? 'Exit full screen' : 'Full screen',
      noStrip: !this.state.savedStrip,
      noStripStyle: Object.assign(toStyle(rects.strip), {
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        background: 'rgba(255,255,255,0.85)',
      }),
      stageStyle,
      stripStyle: toStyle(rects.strip),
      downloadStyle: toStyle(rects.download, { cursor: 'pointer', opacity: this.state.savedStrip ? 1 : 0.4 }),
      restartStyle: toStyle(rects.restart, { cursor: 'pointer' }),
      onDownload: this.handleDownload,
      onRestart: this.handleRestart,
    };
  }
}

</script>
</body>
</html>
