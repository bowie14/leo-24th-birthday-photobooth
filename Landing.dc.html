<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes spin-hint { 0%,100%{ transform: rotate(0deg); } 50%{ transform: rotate(90deg); } }
  html, body { margin: 0; padding: 0; }
</style>
</helmet>
<div style="position:relative;width:100vw;height:100vh;overflow:hidden;background:#0d1030;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <sc-if value="{{ !entered }}" hint-placeholder-val="{{ true }}">
    <div style="{{ stageStyle }}">
      <img ref="{{ setBgRef }}" src="uploads/landing-desktop.png" alt="landing background" style="position:absolute;inset:0;width:100%;height:100%;" />
      <img
        src="uploads/booth.png"
        alt="Tap to start"
        onClick="{{ onBoothClick }}"
        onMouseDown="{{ onPressStart }}"
        onMouseUp="{{ onPressEnd }}"
        onMouseLeave="{{ onPressEnd }}"
        onTouchStart="{{ onPressStart }}"
        onTouchEnd="{{ onPressEnd }}"
        style="{{ boothStyle }}"
      />
    </div>
    <sc-if value="{{ showRotateOverlay }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:rgba(255,255,255,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:20;">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" style="animation:spin-hint 1.4s ease-in-out infinite;">
          <rect x="6" y="2" width="12" height="20" rx="2" stroke="#1a1550" stroke-width="1.8"></rect>
          <line x1="10" y1="19" x2="14" y2="19" stroke="#1a1550" stroke-width="1.8" stroke-linecap="round"></line>
        </svg>
        <div style="font-size:22px;font-weight:600;color:#1a1550;text-align:center;padding:0 32px;">Turn your phone sideways to start!</div>
      </div>
    </sc-if>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isTouch: false, isPortrait: false, entered: false, showRotateOverlay: false, pressed: false, vw: 1440, vh: 900 };

  componentDidMount() {
    const touchQuery = window.matchMedia('(pointer: coarse) and (hover: none)');
    const portraitQuery = window.matchMedia('(orientation: portrait)');
    this.setState({ isTouch: touchQuery.matches, isPortrait: portraitQuery.matches, vw: window.innerWidth, vh: window.innerHeight });

    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    window.addEventListener('resize', this.onResize);

    this.onOrientationChange = (e) => {
      const isPortrait = e.matches;
      if (this.state.showRotateOverlay && !isPortrait) {
        window.location.href = 'Booth.dc.html';
        return;
      }
      this.setState({ isPortrait });
    };
    this.onOrientationChangeGuard = () => {};
    portraitQuery.addEventListener('change', this.onOrientationChange);
    this._portraitQuery = portraitQuery;
  }

  componentWillUnmount() {
    if (this._portraitQuery) this._portraitQuery.removeEventListener('change', this.onOrientationChange);
    window.removeEventListener('resize', this.onResize);
  }

  componentDidUpdate() {
    this.syncImageRefs();
  }

  setBgRef = (el) => { this.bgRef = el; this.syncImageRefs(); };

  computeBgSrc() {
    const { isTouch, isPortrait } = this.state;
    if (!isTouch) return 'uploads/landing-desktop.png';
    return isPortrait ? 'uploads/landing-mobile-portrait.png' : 'uploads/landing-mobile-landscape.png';
  }

  syncImageRefs = () => {
    const bgSrc = this.computeBgSrc();
    if (this.bgRef && this.bgRef.getAttribute('src') !== bgSrc) this.bgRef.src = bgSrc;
  };

  handleBoothClick = () => {
    if (this.state.isTouch && this.state.isPortrait) {
      this.setState({ showRotateOverlay: true });
    } else {
      window.location.href = 'Booth.dc.html';
    }
  };

  renderVals() {
    const { isTouch, isPortrait } = this.state;

    // rect % coords computed from each landing SVG's booth rect (viewBox matches the PNG's aspect ratio)
    let rect, designW, designH;
    if (!isTouch) {
      rect = { left: 30.936, top: 28.226, width: 38.176, height: 65.484 };
      designW = 1440; designH = 900;
    } else if (isPortrait) {
      rect = { left: 9.151, top: 37.475, width: 81.667, height: 40.457 };
      designW = 390; designH = 844;
    } else {
      rect = { left: 36.495, top: 29.028, width: 27.047, height: 62.741 };
      designW = 844; designH = 390;
    }

    // "cover" the viewport with a box that keeps the design's own aspect ratio,
    // so the booth image never stretches independently of the background.
    const vw = this.state.vw || designW;
    const vh = this.state.vh || designH;
    const scale = Math.max(vw / designW, vh / designH);
    const stageW = designW * scale;
    const stageH = designH * scale;
    const stageStyle = {
      position: 'absolute',
      left: (vw - stageW) / 2 + 'px',
      top: (vh - stageH) / 2 + 'px',
      width: stageW + 'px',
      height: stageH + 'px',
    };

    const pressedScale = this.state.pressed ? 0.96 : 1;
    const boothStyle = {
      position: 'absolute',
      left: rect.left + '%',
      top: rect.top + '%',
      width: rect.width + '%',
      height: rect.height + '%',
      cursor: 'pointer',
      transform: `scale(${pressedScale})`,
      opacity: this.state.pressed ? 0.9 : 1,
      transition: 'transform 0.12s ease, opacity 0.12s ease',
      userSelect: 'none',
      WebkitTapHighlightColor: 'transparent',
    };

    return {
      setBgRef: this.setBgRef,
      stageStyle,
      boothStyle,
      entered: this.state.entered,
      showRotateOverlay: this.state.showRotateOverlay,
      onBoothClick: this.handleBoothClick,
      onPressStart: () => this.setState({ pressed: true }),
      onPressEnd: () => this.setState({ pressed: false }),
    };
  }
}

</script>
</body>
</html>
